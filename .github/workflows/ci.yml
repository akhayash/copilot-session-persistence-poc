name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/CopilotSessionPersistencePoc/ClientApp/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/CopilotSessionPersistencePoc/ClientApp
        run: npm ci

      - name: Lint frontend
        working-directory: src/CopilotSessionPersistencePoc/ClientApp
        run: npm run lint

      - name: Build frontend
        working-directory: src/CopilotSessionPersistencePoc/ClientApp
        run: npm run build

      - name: Restore .NET dependencies
        run: dotnet restore CopilotSessionPersistencePoc.slnx

      - name: Build and test .NET solution
        run: dotnet test CopilotSessionPersistencePoc.slnx --no-restore --configuration Release
